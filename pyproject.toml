[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp"
version = "0.2.0"
description = "Local MCP server for explicitly allowed Telegram chats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "keyring>=25.7,<26",
    "mcp==1.30.0",
    "platformdirs>=4,<5",
    "pydantic>=2.11,<3",
]

[project.scripts]
telegram-mcp = "telegram_mcp.cli:main"

[tool.setuptools]
packages = ["telegram_mcp"]
